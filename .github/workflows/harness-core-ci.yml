name: Harness Core CI

on:
  pull_request:
    paths:
      - 'harness-core-v0.1/**'
      - '.github/workflows/harness-core-ci.yml'
  push:
    branches: ['harness-core-v0.1']
    paths:
      - 'harness-core-v0.1/**'
      - '.github/workflows/harness-core-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness-core-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Focused B1 — resume atomic claim
        run: pytest -q tests/test_resume_atomic_claim.py
      - name: Focused B2 — runtime terminal trace
        run: pytest -q tests/test_runtime_terminal_trace.py
      - name: Integrated B1+B2 — ordering and failures
        run: pytest -q tests/test_p0_2_final_rework_integration.py
      - name: RT regressions — adversarial and convergence
        run: pytest -q tests/test_p0_2_red_team_adversarial.py tests/test_p0_2_red_team_revision_guard_convergence.py
      - name: Full pytest
        run: pytest
      - run: python scripts/export_schemas.py
      - run: python scripts/check_schema_drift.py
