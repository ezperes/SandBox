name: Integrator Schema Baseline

on:
  push:
    branches: ['integrator/gt-harness-v0.1']
    paths:
      - '.github/workflows/integrator-schema-baseline.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness-core-v0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrator/gt-harness-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/export_schemas.py
      - name: Commit generated schema baseline
        run: |
          git config user.name "gt-harness-integrator"
          git config user.email "actions@users.noreply.github.com"
          git add harness/schemas
          if git diff --cached --quiet; then
            echo "schema baseline already materialized"
            exit 0
          fi
          git commit -m "chore(harness): materialize schema baseline"
          git push origin HEAD:integrator/gt-harness-v0.1
