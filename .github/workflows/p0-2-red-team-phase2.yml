name: P0-2 Independent Red Team Phase 2

on:
  push:
    branches:
      - worker/p0-2-red-team-phase2-5a18ce0

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen harness subtree is untouched
        shell: bash
        run: |
          set -euo pipefail
          FROZEN=5a18ce034987b14617442fc48194bd9dec2f87f2
          test "$(git rev-parse "$FROZEN:harness-core-v0.1")" = "$(git rev-parse HEAD:harness-core-v0.1)"
          git diff --exit-code "$FROZEN" HEAD -- harness-core-v0.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen harness
        working-directory: harness-core-v0.1
        run: python -m pip install -e '.[dev]'

      - name: Record environment
        working-directory: harness-core-v0.1
        run: |
          python - <<'PY'
          import importlib.metadata as m
          import platform
          print('Python', platform.python_version())
          print('Pydantic', m.version('pydantic'))
          print('LangGraph', m.version('langgraph'))
          print('pytest', m.version('pytest'))
          PY

      - name: Re-run frozen suite
        working-directory: harness-core-v0.1
        run: pytest -q

      - name: Schema export and drift
        working-directory: harness-core-v0.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_schemas.py
          echo "SCHEMA_COUNT=$(find schemas -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          python scripts/check_schema_drift.py

      - name: External independent attacks
        env:
          PYTHONPATH: harness-core-v0.1
        run: pytest -q audit/p0_2_independent_red_team_phase2
