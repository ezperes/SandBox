name: P0-2 Independent Final Reaudit

on:
  push:
    branches:
      - audit/p0-2-independent-final-reaudit-0abd08b

jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit workspace
        uses: actions/checkout@v4
        with:
          ref: audit/p0-2-independent-final-reaudit-0abd08b
          path: auditor

      - name: Checkout immutable candidate
        uses: actions/checkout@v4
        with:
          ref: 0abd08b3c55297bfe92dcce2ab561dd765a1ba2b
          path: candidate

      - name: Prove exact SHA and tree
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0abd08b3c55297bfe92dcce2ab561dd765a1ba2b"
          test "$(git rev-parse HEAD^{tree})" = "9fcfcefd0d82a655233564151d4f51942c3a4a91"
          echo "AUDITED_HEAD=$(git rev-parse HEAD)"
          echo "AUDITED_TREE=$(git rev-parse HEAD^{tree})"
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact candidate
        working-directory: candidate/harness-core-v0.1
        run: python -m pip install -e '.[dev]'

      - name: Record runtime versions
        working-directory: candidate/harness-core-v0.1
        run: |
          python - <<'PY'
          import sys, pytest, pydantic, langgraph
          print('Python', sys.version.replace('\n',' '))
          print('pytest', pytest.__version__)
          print('pydantic', pydantic.__version__)
          print('langgraph', getattr(langgraph, '__version__', 'no-__version__'))
          PY
          python -m pip show langgraph | grep '^Version:'

      - name: Focused B1
        working-directory: candidate/harness-core-v0.1
        run: pytest -q tests/test_resume_atomic_claim.py

      - name: Focused B2
        working-directory: candidate/harness-core-v0.1
        run: pytest -q tests/test_runtime_terminal_trace.py

      - name: Integrated B1+B2 failure ordering
        working-directory: candidate/harness-core-v0.1
        run: pytest -q tests/test_p0_2_final_rework_integration.py

      - name: RT-01 through RT-12
        working-directory: candidate/harness-core-v0.1
        run: pytest -q tests/test_p0_2_red_team_adversarial.py tests/test_p0_2_red_team_revision_guard_convergence.py

      - name: Full candidate pytest before external probes
        working-directory: candidate/harness-core-v0.1
        run: pytest -q

      - name: Schema export
        working-directory: candidate/harness-core-v0.1
        run: python scripts/export_schemas.py

      - name: Schema drift
        working-directory: candidate/harness-core-v0.1
        run: python scripts/check_schema_drift.py

      - name: Verify candidate production remained untouched
        working-directory: candidate
        run: git diff --exit-code -- harness-core-v0.1/harness

      - name: Inject external audit probes only into runner workspace
        run: |
          cp auditor/audit/p0_2_external_probe.py candidate/harness-core-v0.1/tests/audit_external_probe.py
          cp auditor/audit/p0_2_t07_probe.py candidate/harness-core-v0.1/tests/audit_t07_probe.py

      - name: Run independent external probes
        working-directory: candidate/harness-core-v0.1
        run: pytest -q tests/audit_external_probe.py tests/audit_t07_probe.py
